# crefo-chat as a SINGLE Indie Box app (see brainbot-com/indie-box
# docs/app-integration.md). The whole Creditreform stack -- the chat
# (indie-chat + Creditreform overlay), the Insights dashboard and the
# read-only revenue MCP -- installs as ONE app:
#
#   indiebox/install.sh crefo-chat indiebox/crefo-chat.compose.yml
#
# An app gets exactly ONE gateway route (the labelled service), so a small
# Caddy front is the labelled service and fans out by path on one origin:
#
#   /             -> crefo-chat-server:3000   (the chat)
#   /insights/*   -> crefo-insights:3060      (dashboard; prefix stripped,
#                                              app.py re-adds it via URL_PREFIX)
#
# The chat's Insights workspace tab embeds the dashboard through the relative
# /insights/ URL -- same origin, HTTPS from the platform gateway, so the mic,
# clipboard and iframe all work without the aibox1 TLS sidecar (deploy-tls/).
#
# Before installing (see indiebox/README.md):
#   * place the customer DB at <SECURE_STORAGE_DIR|DATA_DIR>/crefo/crefo-customers.duckdb
#   * set CREFO_CHAT_ENCRYPTION_KEY (+ optional MCP_TOKEN, DATAOPS_TOKEN,
#     CREFO_*_TAG image pins) in the box's shared .env
#
# Creditreform customer + credit data is sensitive, so every service opts into
# the encrypted-storage profile: on a box with encrypted storage the app waits
# for the unlock; on a plain box it runs on the normal data dir.

services:

  # ---- public entry: path router (the ONE labelled service = the ONE route) --
  crefo-chat:
    image: caddy:2-alpine
    profiles:
      - ${SECURE_STORAGE_PROFILE:-stable}
    restart: always
    labels:
      indiebox.app.name: "creditreform:agents"
      indiebox.app.icon: "message-chatbot"
      indiebox.app.http-port: "80"
      # App version (read straight off this label by GET /v1/apps). The images
      # float on the CREFO_*_TAG pins, not a per-release semver, so this tracks
      # the compose-app revision itself; bump it when the app definition changes.
      indiebox.app.version: "1.0.0"
    configs:
      - source: crefo-router-caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      secure-gate:
        condition: service_completed_successfully

  # ---- the chat: indie-chat + Creditreform overlay ---------------------------
  crefo-chat-server:
    image: ghcr.io/brainbot-com/crefo-chat:${CREFO_CHAT_TAG:-latest}
    profiles:
      - ${SECURE_STORAGE_PROFILE:-stable}
    restart: always
    environment:
      PORT: "3000"
      PYTHON: /opt/venv/bin/python
      # Chat state (indie.db) lives on the box data dir, not in the container.
      INDIE_DB_PATH: /data/indie.db
      # Encryption at rest for conversation titles + messages (64 hex chars):
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Required -- `compose config` (and therefore the install) fails without it.
      ENCRYPTION_KEY: ${CREFO_CHAT_ENCRYPTION_KEY:?set CREFO_CHAT_ENCRYPTION_KEY in the box .env}
      # LLM: the platform Ollama on the shared `llm` network. OLLAMA_UPSTREAM
      # retargets the client-side 127.0.0.1:11434 provider there server-side;
      # EXTRA_ALLOWED_HOSTS additionally allows it as a direct custom endpoint.
      OLLAMA_UPSTREAM: ollama
      EXTRA_ALLOWED_HOSTS: ollama
      # Coding agents [beta]: per-turn containers join `llm`, reach Ollama and
      # this server by service name, and get the live dashboard source mounted
      # (same dir the crefo-insights service seeds and runs from -> agent edits
      # hot-reload in the embedded dashboard).
      # The per-turn agent containers use this image; the crefo-agent-image
      # service below carries the same reference so `docker compose up` (the
      # install/update path) pulls it onto the box -- see that service.
      AGENT_IMAGE: ghcr.io/brainbot-com/crefo-agent:${CREFO_AGENT_TAG:-latest}
      AGENT_NETWORK: llm
      AGENT_ENDPOINT_HOST: ollama
      AGENT_CALLBACK_URL: http://crefo-chat-server:3000
      AGENT_EXTRA_MOUNTS: '[{"host":"${SECURE_STORAGE_DIR:-${DATA_DIR:-/data}}/crefo/insights-src","container":"/workspace/abcd-dashboard"}]'
      AGENT_MEMORY: 1g
      AGENT_CPUS: "1"
      AGENT_MAX_CONCURRENT: "3"
      # Insights dashboard base URL on the app network. Two consumers need it:
      #   * the read-only "Tabellen" app via the `crefo` connector
      #     (CREFO_DASHBOARD_URL -> POST /api/tabelle), and
      #   * the agent Datenpflege write tools (DATAOPS_URL -> /api/datenpflege/*,
      #     token-gated by DATAOPS_TOKEN below).
      # Same dashboard for both. Without these the Tabellen app iframe fails with
      # "CREFO_DASHBOARD_URL/DATAOPS_URL not configured on the server".
      CREFO_DASHBOARD_URL: http://crefo-insights:3060
      DATAOPS_URL: http://crefo-insights:3060
      # Datenpflege write API token (must match crefo-insights' DATAOPS_TOKEN).
      # Empty = agent write tools inert; the read-only Tabellen app still works.
      DATAOPS_TOKEN: ${DATAOPS_TOKEN:-}
      MCP_SERVERS: "[]"
    volumes:
      - ${SECURE_STORAGE_DIR:-${DATA_DIR:-/data}}/crefo/chat:/data
      # Agents launch per-turn "pi" containers on the host via this socket
      # (fixed image, mem/cpu/pids caps, only the agent's own volume).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - llm
    depends_on:
      secure-gate:
        condition: service_completed_successfully

  # ---- agent image, pulled onto the box as part of the app -------------------
  # The coding agents run as short-lived per-turn containers the chat server
  # launches from AGENT_IMAGE over the Docker socket -- they are NOT a
  # long-running service, so nothing here needs to stay up. But the image still
  # has to be ON the box: the agent-engine gate hides the whole composer until
  # `docker image inspect AGENT_IMAGE` succeeds, so the upstream "pull on first
  # turn" can never fire. On aibox1 the image is built locally and is always
  # present; on the box it is a registry image, and Compose only pulls images it
  # sees on a service. This one-shot service is that reference: naming the same
  # image makes `docker compose up` (the install/update path) pull it onto the
  # box, then it exits and the image persists. Re-installing with a new
  # CREFO_AGENT_TAG re-pulls it the same way. It carries no indiebox.app.* label
  # (not a card of its own) and touches no data, so it needs no volumes/network.
  crefo-agent-image:
    image: ghcr.io/brainbot-com/crefo-agent:${CREFO_AGENT_TAG:-latest}
    profiles:
      - ${SECURE_STORAGE_PROFILE:-stable}
    restart: "no"
    command: ["sh", "-c", "echo crefo-agent image present on the box"]

  # ---- Insights dashboard (embedded at /insights) ----------------------------
  crefo-insights:
    image: ghcr.io/brainbot-com/crefo-insights:${CREFO_INSIGHTS_TAG:-latest}
    profiles:
      - ${SECURE_STORAGE_PROFILE:-stable}
    restart: always
    labels:
      # Sole writer of the customer DuckDB ("Festschreiben", ann_* Datenpflege,
      # snapshots): pause during backups for a consistent DB file.
      indiebox.pause-for-backup: "true"
    environment:
      PORT: "3060"
      HOST: "0.0.0.0"
      DB_PATH: /data/crefo-customers.duckdb
      SNAP_PATH: /snap/festschreibungen.sqlite
      # Served under /insights behind the router (prefix stripped by Caddy,
      # re-added to outgoing URLs by app.py).
      URL_PREFIX: /insights
      # "Im Chat-Agenten weiterarbeiten" link target. The chat shares this app's
      # gateway origin at the root, so a root-relative "/" opens it; without this
      # the dashboard defaults to the aibox1 LAN URL (http://10.1.9.7:3055).
      CHAT_URL: /
      # Live-edit mode: seed the baked source into /src (a data-dir mount, the
      # same dir agents get via AGENT_EXTRA_MOUNTS above) and run from it with
      # hot reload. NOTE: while seeded, image updates do NOT change the running
      # code -- delete <data>/crefo/insights-src to re-seed from a newer image.
      SEED_SRC_DIR: /src
      RELOAD: "1"
      # Datenpflege write API token (must match the chat's DATAOPS_TOKEN).
      # Empty = API off, dashboard UI unaffected.
      DATAOPS_TOKEN: ${DATAOPS_TOKEN:-}
    volumes:
      # READ-WRITE -- this service is the sole writer; the MCP mounts it :ro.
      - ${SECURE_STORAGE_DIR:-${DATA_DIR:-/data}}/crefo/crefo-customers.duckdb:/data/crefo-customers.duckdb
      - ${SECURE_STORAGE_DIR:-${DATA_DIR:-/data}}/crefo/snapshots:/snap
      - ${SECURE_STORAGE_DIR:-${DATA_DIR:-/data}}/crefo/insights-src:/src
    networks:
      - default
      # `llm` so per-turn agent containers reach the Datenpflege API directly.
      - llm
    depends_on:
      secure-gate:
        condition: service_completed_successfully

  # ---- read-only revenue MCP (chat tools + agents) ---------------------------
  crefo-revenue-mcp:
    image: ghcr.io/brainbot-com/crefo-revenue-mcp:${CREFO_REVENUE_MCP_TAG:-latest}
    profiles:
      - ${SECURE_STORAGE_PROFILE:-stable}
    restart: always
    environment:
      HOST: "0.0.0.0"
      PORT: "9000"
      DB_PATH: /data/crefo-customers.duckdb
      # The Excel-export tools (export_excel, export_query_excel) hand the chat a
      # download LINK the user's browser follows, so it must be browser-reachable,
      # NOT the internal crefo-insights:3060 name. The dashboard is path-routed at
      # /insights on the gateway origin (see the router below), so a root-relative
      # /insights makes links like /insights/export.xlsx resolve on the same
      # origin. Without this, DASHBOARD_URL defaults to the aibox1 LAN IP
      # (http://10.1.9.7:3061), which no box browser can reach.
      DASHBOARD_URL: /insights
      # Bearer token required on every request; the chat's global "crmrev" MCP
      # row sends it (url http://crefo-revenue-mcp:9000/mcp). Empty = auth off.
      MCP_TOKEN: ${MCP_TOKEN:-}
    volumes:
      - ${SECURE_STORAGE_DIR:-${DATA_DIR:-/data}}/crefo/crefo-customers.duckdb:/data/crefo-customers.duckdb:ro
    networks:
      - default
      # `llm` so agent containers reach it under the same URL as the chat.
      - llm
    depends_on:
      secure-gate:
        condition: service_completed_successfully

# Router config inline (an app install is a single Compose file -- no sidecar
# file uploads -- so the Caddyfile ships as compose `configs.content`).
configs:
  crefo-router-caddyfile:
    content: |
      :80 {
          # Dashboard under /insights: strip the prefix (handle_path); the
          # dashboard's URL_PREFIX puts it back on outgoing URLs.
          handle_path /insights/* {
              reverse_proxy crefo-insights:3060 {
                  flush_interval -1
              }
          }
          redir /insights /insights/ permanent
          # Everything else is the chat. flush_interval -1 keeps SSE token
          # streaming unbuffered.
          handle {
              reverse_proxy crefo-chat-server:3000 {
                  flush_interval -1
              }
          }
      }

networks:
  default:
  llm:
    name: llm
